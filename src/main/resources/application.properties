server.port=8070
spring.application.name=api-gateway-grupo07

# Conexion con Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Descubrimiento
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Rutas balanceadas en minusculas
spring.cloud.gateway.routes[0].id=solicitud-service
spring.cloud.gateway.routes[0].uri=lb://solicitud-service-grupo07
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/solicitudes/**

spring.cloud.gateway.routes[1].id=evaluacion-service
spring.cloud.gateway.routes[1].uri=lb://evaluacion-service-grupo07
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/evaluaciones/**