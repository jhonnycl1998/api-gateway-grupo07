server.port=8070
spring.application.name=api-gateway-grupo07

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=solicitud-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://SOLICITUD-SERVICE-GRUPO07
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/solicitudes/**

spring.cloud.gateway.server.webflux.routes[1].id=evaluacion-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EVALUACION-SERVICE-GRUPO07
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/evaluaciones/**